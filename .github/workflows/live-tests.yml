name: Live-Tests (geplant)

# DRIFT-005. Die Live-Tests waren bis hierher nur per `-m "not live"` aus der
# CI ausgeschlossen und liefen damit nirgends automatisch. Ein Schemawechsel
# bei der Quelle — genau die Klasse Fehler, gegen die Live-Tests existieren —
# fiel erst auf, wenn jemand von Hand `pytest -m live` fuhr.
#
# Deshalb taeglich statt pro Push: Diese Tests messen nicht den Diff, sondern
# die Quelle. Die aendert sich unabhaengig davon, ob hier jemand committet.

on:
  schedule:
    # 06:17 UTC. Nicht zur vollen Stunde: dann sind die Runner-Queues am
    # laengsten, und ein geplanter Lauf wird verzoegert oder faellt aus.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        run: uv pip install -e ".[dev]" --system

      # ===== PROBE — wird vor dem PR wieder entfernt =====
      # Isoliert den HTTP 400: Suche und Sentiment rufen denselben Endpunkt auf,
      # die Suche faellt. Gemessen wird deshalb dieselbe Anfrage zweimal, nur
      # `sort` unterschiedlich — und einmal mit Datumsbereich, um `sort` von der
      # zweiten Abweichung zu trennen. Ausgegeben wird nur der Statuscode, nie
      # der Schluessel.
      - name: PROBE — was quittiert die Quelle?
        env:
          K: ${{ secrets.WORLD_NEWS_API_KEY }}
        run: |
          set -uo pipefail
          B="https://api.worldnewsapi.com"
          S="$B/search-news?text=Volksschule&language=de&source-country=ch&number=3&sort-direction=DESC"
          probe() { # $1 = Label, $2 = URL
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' -H "x-api-key: $K" "$2")
            echo "$1 -> HTTP $code"
            [ "$code" != "200" ] && echo "   Antwort: $(head -c 300 /tmp/body.txt)"
            return 0
          }
          probe "sort=relevance         " "$S&sort=relevance"
          probe "sort=publish-time      " "$S&sort=publish-time"
          probe "sort=relevance +Datum  " "$S&sort=relevance&earliest-publish-date=2026-07-15%2000:00:00&latest-publish-date=2026-08-14%2023:59:59"
          probe "ohne sort              " "$S"
          probe "/top-news (wie im Test)" "$B/top-news?source-country=ch&language=de&number=5"

      - name: Live-Tests gegen die echte Quelle
        id: pytest
        run: pytest tests/ -m live -v --junitxml=live-report.xml
        env:
          PYTHONPATH: src
          WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}

      # Ohne diesen Schritt waere der Workflow selbst die naechste Falle: Sind
      # alle Tests uebersprungen, meldet pytest Exit-Code 0, und ein Lauf, der
      # nichts geprueft hat, saehe aus wie ein Lauf, der alles geprueft hat.
      - name: Nachweis, dass etwas gemessen wurde
        if: always()
        run: python scripts/check_live_run.py live-report.xml

      # Ein geplanter Lauf hat kein Publikum: Es gibt keinen PR, auf dem ein
      # rotes Kreuz auffiele. Ohne Meldung waere die Abdeckung zwar da, aber
      # folgenlos.
      - name: Bei Fehlschlag ein Issue oeffnen oder aktualisieren
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export TITEL="Live-Tests rot: die Quelle antwortet nicht mehr wie erwartet"
          # Ohne das Label bricht `gh issue create` ab — dann faellt ausgerechnet
          # die Meldung aus, die den Fehlschlag sichtbar machen soll. Anlegen
          # statt voraussetzen; `|| true`, weil es beim zweiten Mal schon da ist.
          gh label create live-tests --color B60205 \
            --description "Geplanter Live-Lauf gegen die echte Quelle" 2>/dev/null || true
          nummer="$(gh issue list --state open --label live-tests --limit 50 \
            --json number,title --jq 'map(select(.title == env.TITEL)) | .[0].number // empty')"
          text="Der geplante Live-Lauf ist fehlgeschlagen: $LAUF

          Erst die Quelle abfragen, dann einordnen — nicht aus der Fehlermeldung
          schliessen. Ein roter Live-Test heisst nicht zwingend, dass Daten weg
          sind; er hiess in diesem Portfolio auch schon, dass die Quelle die
          Schreibweise ihrer Kopfzeile gewechselt hatte.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          if [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "$text"
          else
            gh issue create --title "$TITEL" --label live-tests --body "$text"
          fi
