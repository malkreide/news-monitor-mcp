name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        run: uv pip install -e ".[dev]" --system

      - name: Linting mit ruff
        run: python -m ruff check src/

      - name: Syntax-Prüfung
        run: python -m py_compile src/news_monitor_mcp/server.py

      - name: Import-Test
        run: python -c "from news_monitor_mcp.server import mcp; print('Import OK')"

      - name: Unit-Tests (kein API-Key nötig)
        run: pytest tests/ -m "not live" -v
        env:
          PYTHONPATH: src
        timeout-minutes: 5

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ruff

      - run: python -m ruff check src/

      # ruff format --check vorerst deaktiviert (Refactoring ausstehend)
      # - run: python -m ruff format --check src/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: news-monitor-mcp:ci
          load: true

      - name: Smoke-Test — `--help` aus dem Image
        run: |
          docker run --rm --entrypoint news-monitor-mcp news-monitor-mcp:ci --help

      - name: Smoke-Test — Auth wird im HTTP-Mode erzwungen
        run: |
          # MCP_BEARER_TOKEN ist Pflicht: ohne den Token muss der Container
          # mit Exit-Code 2 abbrechen (siehe PR #2 / SEC-HTTP-NO-AUTH).
          set +e
          docker run --rm news-monitor-mcp:ci
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "expected exit 2 when MCP_BEARER_TOKEN unset, got $rc"
            exit 1
          fi
