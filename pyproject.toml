[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-monitor-mcp"
version = "0.3.6"
description = "MCP server for global news monitoring via WorldNewsAPI – search, sentiment analysis, top headlines, and media monitoring for Swiss public institutions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "malkreide" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "news",
    "media-monitoring",
    "swiss-open-data",
    "sentiment-analysis",
    "worldnewsapi",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Upper bound added deliberately: `mcp` 2.0.0 removed `mcp.server.fastmcp`
    # outright (the API moved to `mcp.server.mcpserver`), so an unbounded
    # `>=1.28.1` breaks every fresh install — CI and `pip install` alike.
    # Migrating to the 2.x API is real work and a decision to take on purpose,
    # not one a resolver should make silently.
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "starlette>=0.36.0,<2",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    # Exakt gepinnt, nicht `>=`: ruff ist ein Gate, kein Hilfsmittel. Eine
    # neuere Version meldet Abweichungen an Code, den niemand angefasst hat.
    # Der Pin steht hier und nur hier — die CI installiert ihn ueber das
    # `dev`-Extra mit und hat keinen eigenen Pin-Schritt mehr. Beim Anheben:
    # Version aendern, `ruff format` einmal ueber die gelinteten Pfade laufen
    # lassen und das Ergebnis mit committen.
    "ruff==0.16.4",
    # Nur fuer tests/test_meldeweg.py: liest den Shell-Block aus dem
    # Live-Test-Workflow, damit der Test das Original prueft und keine Kopie.
    "pyyaml>=6.0",
]

[project.scripts]
news-monitor-mcp = "news_monitor_mcp.server:main"

[project.urls]
Homepage = "https://github.com/malkreide/news-monitor-mcp"
Repository = "https://github.com/malkreide/news-monitor-mcp"
Issues = "https://github.com/malkreide/news-monitor-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/news_monitor_mcp"]

[tool.hatch.version]
path = "src/news_monitor_mcp/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",  # Line too long — bewusst toleriert (lange Field-Beschreibungen)
    "E701",  # Multiple statements on one line — Codestil im Server bewusst so
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `auto` statt des Strict-Defaults. Anlass: Die drei Live-Tests trugen nur
# `@pytest.mark.live` und keinen `@pytest.mark.asyncio`. Im Strict-Modus heisst
# das nicht «uebersprungen», sondern «async def functions are not natively
# supported» — sie liefen also nie, und wer `-m live` aufrief, bekam drei
# Fehler, die nichts ueber die Quelle aussagten.
#
# Mit `auto` kann eine vergessene Markierung diesen Fehler nicht mehr erzeugen:
# Jede `async def test_*` laeuft.
asyncio_mode = "auto"
markers = [
    "live: braucht Netzzugang. Die Routenpruefung laeuft ohne Schluessel; Tests, die einen WORLD_NEWS_API_KEY brauchen, ueberspringen sich ohne (deselect mit '-m not live')",
]
